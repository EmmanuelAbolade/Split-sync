<!--
  File: splitsync-hub.html
  Purpose: Clickable mockup of the recommended SplitSync navigation once
           Circles features are added. Home becomes a hub of "spaces"
           (Expenses, Circles, Loans, Aid, Events). Each space has its own
           ledger and balance, and balances are never added together.
  Key ideas shown:
    1. Separate ledgers per space (no netting across spaces)
    2. One "Needs attention" list for tasks, not money
    3. Context-aware + button (action sheet)
    4. Request privacy: who can send you loan / aid requests
    5. Held-request inbox for people outside your trusted list
  Notes: Mock data only. Styling follows the current SplitSync web app
         (blue gradient header, white cards, bottom nav with centre +).
-->
<style>

  --owed:#4ade80; --owed-soft:#163323; --owed-line:#245236;

/* ---------- Base ---------- */

svg.lucide{width:20px;height:20px;stroke-width:2;flex:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}

.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}

.stack{display:flex;flex-direction:column;gap:18px;padding-block:18px}

.bg-c{background:var(--c)} .soft-c{background:var(--cs);color:var(--c)} .fg-c{color:var(--c)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-end;z-index:30;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer;padding:6px 0}
.nav button svg.lucide{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--primary)}
.nav .fab{flex:none;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2445c4);color:#fff;margin:-28px 8px 0;box-shadow:0 8px 20px rgba(36,69,196,.4);justify-content:center}
.nav .fab svg.lucide{width:30px;height:30px}
.chat-fab{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 244px));width:52px;height:52px;border-radius:50%;background:var(--chat);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 8px 20px rgba(124,58,237,.35);z-index:29;cursor:pointer}

/* ---------- Modal / bottom sheet (scrollable body) ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,12,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}

.sheet-head{display:flex;align-items:center;gap:10px;padding:14px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}

.sheet-body{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.grabber{width:42px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 0}

/* Action sheet items */
.action{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}

.action .grow{flex:1}
.action small{display:block;color:var(--muted);font-size:13px}

/* Form bits */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.flabel{font-size:14px;font-weight:700}

.radio input{margin-top:3px;accent-color:var(--primary)}
.radio:has(input:checked){border-color:var(--primary);background:var(--exp-soft)}
.radio small{display:block;color:var(--muted);font-size:12px}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--primary)}

/* Simple bar chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .col i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--c)}
.chart .col span{font-size:12px;color:var(--muted)}
.chart .col b{font-size:12px;font-variant-numeric:tabular-nums}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;z-index:60;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}

@media (max-width:380px){.spaces{grid-template-columns:1fr}.space.wide{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script>
/* ==========================================================================
   Space registry
   Each space maps to its own collection set (and ledger). Expenses and
   Events stay in the default Firestore DB; Circles, Loans and Aid live in
   the named "circles" DB. Balances are computed per space and never summed.
   ========================================================================== */
const SPACES = {
  expenses: { name: "Expenses", cls: "c-exp", icon: "receipt", hero: ["#3b82f6", "#2445c4"], blurb: "Split bills with your groups" },
  circles:  { name: "Circles",  cls: "c-cir", icon: "refresh-ccw-dot", hero: ["#8b5cf6", "#5b21b6"], blurb: "Rotating savings (ajo / susu)" },
  loans:    { name: "Loans",    cls: "c-loan", icon: "hand-coins", hero: ["#f59e0b", "#c2410c"], blurb: "Interest-free loans between people" },
  aid:      { name: "Aid",      cls: "c-aid", icon: "heart-handshake", hero: ["#14b8a6", "#0f766e"], blurb: "Help someone in your community" },
  events:   { name: "Events",   cls: "c-evt", icon: "party-popper", hero: ["#ec4899", "#be185d"], blurb: "Budgets and pledges for occasions" }
};

/* ---------- Mock data (mirrors the user's current test account) ---------- */
const state = {
  user: { name: "Hymzie", email: "test2@example.com" },
  hidden: [],                      // spaces the user removed from Home
  privacy: { loans: "trusted", aid: "shared", direct: "groups" },
  trusted: ["Three T", "Kemi", "Tolu"],
  expenses: {
    owe: "EUR 60.49", owed: "—",
    groups: [
      { n: "Family house", m: 2, cur: "GBP", icon: "home", s: "Settled" },
      { n: "Dupa", m: 3, cur: "USD", icon: "coffee", s: "Settled" },
      { n: "Super G", m: 2, cur: "EUR", icon: "graduation-cap", s: "You owe EUR 23.00", neg: true },
      { n: "Test members", m: 4, cur: "EUR", icon: "users", s: "Settled" },
      { n: "My Group", m: 4, cur: "EUR", icon: "users", s: "You owe EUR 37.50", neg: true }
    ]
  },
  circles: [{ n: "Family Ajo Circle", amt: 200, cycle: 3, total: 6, due: "10 Nov", slot: 5, paid: false, next: "Tolu" }],
  loans: [
    { dir: "lent", who: "Three T", amt: 300, out: 150, next: "€75 due 30 Nov" },
    { dir: "borrowed", who: "Kemi", amt: 120, out: 80, next: "€40 due 15 Nov" }
  ],
  aid: [{ n: "Support for the Okafor family", group: "Cork Community", target: 1500, got: 1040, mine: 25, ends: "15 Nov" }],
  events: [{ n: "Ada's Wedding", budget: 6000, spent: 4180, approvals: 1 }],
  requests: [
    { id: "q1", kind: "aid", from: "Tolu", trusted: true, text: "Shared a help request in Family Ajo Circle", amt: "Target €400" },
    { id: "q2", kind: "loans", from: "Marco", trusted: false, text: "Asked to borrow €250. You share 1 group: Test members", amt: "€250" }
  ],
  activity: [
    { sp: "circles", t: "Tolu received the cycle 3 pot", a: "€1,200", d: "Today" },
    { sp: "expenses", t: "Gen · My Group", a: "You owe EUR 37.50", neg: true, d: "22/07/2026" },
    { sp: "loans", t: "Three T repaid part of the loan", a: "+€75", pos: true, d: "31 Oct" },
    { sp: "aid", t: "You pledged to the Okafor family", a: "€25", d: "30 Oct" },
    { sp: "events", t: "Venue payment approved", a: "€2,500", d: "28 Oct" },
    { sp: "expenses", t: "Dublin appointment · Super G", a: "You owe EUR 23.00", neg: true, d: "14/07/2026" }
  ]
};

/* ==========================================================================
   Helpers
   ========================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = n => "€" + Number(n).toLocaleString("en-IE");
const pct = (a, b) => Math.min(100, Math.round(a / b * 100));
const icons = () => window.lucide && lucide.createIcons();
const sp = k => SPACES[k];

function toast(msg, icon = "check-circle-2") {
  $("#toastRoot").innerHTML = `<div class="toast" role="status"><i data-lucide="${icon}"></i>${esc(msg)}</div>`;
  icons(); clearTimeout(toast.t); toast.t = setTimeout(() => ($("#toastRoot").innerHTML = ""), 3000);
}

/** Bottom sheet modal with grabber, header, scrollable body and optional footer. */
function sheet({ title, body, foot = "", onMount }) {
  $("#modalRoot").innerHTML = `<div class="overlay" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="grabber"></div>
    <div class="sheet-head"><h3 id="shTitle">${title}</h3><button class="icon-btn" data-close aria-label="Close"><i data-lucide="x"></i></button></div>
    <div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ""}</div></div>`;
  icons();
  const root = $("#modalRoot");
  root.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", e => { if (e.target === el || el.tagName === "BUTTON") closeSheet(); }));
  onMount && onMount(root);
}
function closeSheet() { $("#modalRoot").innerHTML = ""; }
document.addEventListener("keydown", e => e.key === "Escape" && closeSheet());

/** Short balance line per space. Each space reports its own figure only. */
function spaceSummary(k) {
  switch (k) {
    case "expenses": return { val: `You owe ${state.expenses.owe}`, cls: "neg", sub: `${state.expenses.groups.length} groups` };
    case "circles": { const c = state.circles[0]; return { val: c.paid ? "Paid this cycle" : `€${c.amt} due ${c.due}`, cls: c.paid ? "pos" : "neg", sub: `${state.circles.length} circle · payout slot ${c.slot}` }; }
    case "loans": { const lent = state.loans.filter(l => l.dir === "lent").reduce((a, l) => a + l.out, 0), owe = state.loans.filter(l => l.dir === "borrowed").reduce((a, l) => a + l.out, 0);
      return { val: `Owed €${lent} · Owe €${owe}`, cls: "", sub: `${state.loans.length} active loans` }; }
    case "aid": return { val: `You pledged €${state.aid.reduce((a, x) => a + x.mine, 0)}`, cls: "", sub: `${state.aid.length} active request` };
    case "events": { const e = state.events[0]; return { val: `${eur(e.spent)} of ${eur(e.budget)}`, cls: "", sub: `${e.approvals} spend to approve` }; }
  }
}

    sheet({ title: "Customise Home",
      body: `<p class="muted" style="margin:0">Show only the spaces you use. Hiding a space keeps its data safe.</p>
        ${Object.keys(SPACES).map(k => `<label class="switch ${sp(k).cls}" style="padding:8px 0;border-bottom:1px solid var(--line)">
          <input type="checkbox" value="${k}" ${state.hidden.includes(k) ? "" : "checked"} ${k === "expenses" ? "disabled" : ""}>
          <span class="dot soft-c" style="width:30px;height:30px"><i data-lucide="${sp(k).icon}"></i></span>
          <span style="flex:1"><b>${sp(k).name}</b><br><small class="muted">${sp(k).blurb}${k === "expenses" ? " · always on" : ""}</small></span></label>`).join("")}`,
      foot: `<button class="btn btn-primary" id="cuSave">Done</button>`,
      onMount: r => $("#cuSave", r).addEventListener("click", () => {
        state.hidden = [...r.querySelectorAll("input[type=checkbox]:not(:checked)")].map(i => i.value);
        closeSheet(); render(); toast("Home updated");
      }) });
  },

  spaceInfo(el) {
    const k = el.dataset.k, s = sp(k), db = ["expenses", "events"].includes(k) ? "default database" : "circles database";
    sheet({ title: `About ${s.name}`,
      body: `<p style="margin:0">${s.blurb}.</p>
        <div class="note"><i data-lucide="database"></i><span>Stored in the ${db}. Same login as the rest of SplitSync.</span></div>
        <div class="note"><i data-lucide="lock"></i><span>Balances here are calculated only from this space. Settling a debt here never changes a balance in another space.</span></div>`,
      foot: `<button class="btn btn-primary" data-close>Got it</button>` });
  },

  evt(el) {
    const e = state.events[0], ok = el.dataset.ok === "1";
    if (ok) e.spent += 180; e.approvals = 0; render(); toast(ok ? "Spend approved" : "Spend rejected");
  }
};

/* ==========================================================================
   Router and events
   ========================================================================== */
let current = "home";
function render() {
  const [name, arg] = current.split(":");
  $("#screen").innerHTML = name === "space" ? screens.space(arg) : screens[name]();
  document.querySelectorAll(".nav [data-go]").forEach(b => b.setAttribute("aria-current", b.dataset.go === name || (name === "space" && b.dataset.go === "home") ? "page" : "false"));
  icons();
}
function go(v) {
  const [n, a] = (v || "home").split(":");
  current = (screens[n] && (n !== "space" || SPACES[a])) ? v : "home";
  try { history.replaceState(null, "", "#" + current.replace(":", "-")); } catch (e) {}
  closeSheet(); render(); window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const f = e.target.closest("[data-filter]"); if (f) { state.actFilter = f.dataset.filter; return render(); }
  const s = e.target.closest("[data-stat]"); if (s) { state.statTab = s.dataset.stat; return render(); }
  const a = e.target.closest("[data-act]"); if (a && actions[a.dataset.act]) actions[a.dataset.act](a);
});
window.addEventListener("hashchange", () => go(location.hash.slice(1).replace("-", ":")));
go((location.hash.slice(1) || "home").replace("-", ":"));
</script>
