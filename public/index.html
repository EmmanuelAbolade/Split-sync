<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ========================================= -->
    <!-- Basic Meta Setup -->
    <!-- ========================================= -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    
    <!-- ========================================= -->
    <!-- App Information -->
    <!-- ========================================= -->
    <meta name="description" content="SplitSync is a smart shared expense management app for tracking group expenses, splitting bills, settling payments, and managing shared finances easily."/>
    <meta name="author" content="SplitSync Team" />
    <meta name="keywords" content="SplitSync, expense sharing, split bills, group finance, PWA expense tracker" />
    
    
    <!-- ========================================= -->
    <!-- Favicon & App Icons -->
    <!-- ========================================= -->
    <!--link rel="icon" href="%PUBLIC_URL%/favicon.ico" /-->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/logo192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/logo192.png">
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">

    <!-- ========================================= -->
    <!-- Open Graph (Social Sharing Preview) -->
    <!-- ========================================= -->
    <meta property="og:title" content="SplitSync – Smart Shared Expense Manager" />
    <meta property="og:description" content="Track, split, and settle expenses with friends effortlessly." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo192.png" />
    <meta property="og:url" content="https://splitsync-dev.web.app" />
    
    <!-- ========================================= -->
    <!-- Twitter Card -->
    <!-- ========================================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SplitSync – Smart Shared Expense Manager" />
    <meta name="twitter:description" content="The easiest way to manage shared expenses." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />
    

    
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>SplitSync – Smart Shared Expense Manager</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
